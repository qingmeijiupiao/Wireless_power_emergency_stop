## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=6.0.0'

  # ===== 以下组件来自同一仓库 wireless-power-components =====
  # git 地址与提交版本通过 YAML 锚点统一定义，其余条目全部用别名引用。
  # 升级时只需修改下面第一处 version（锚点定义处），所有组件自动跟随，避免逐个更新时漏改。
  diagnostic_log:
    git: &wireless_power_components_repo https://github.com/qingmeijiupiao/wireless-power-components.git
    path: components/common/diagnostic_log
    version: &wireless_power_components_version d3f1c7822c9d033e4f9374416caee392be21ae40
  HXC_NVS:
    git: *wireless_power_components_repo
    path: components/bsp/HXC_NVS
    version: *wireless_power_components_version
  ADC:
    git: *wireless_power_components_repo
    path: components/bsp/ADC
    version: *wireless_power_components_version
  wifi_manager:
    git: *wireless_power_components_repo
    path: components/bsp/wifi_manager
    version: *wireless_power_components_version
  shell:
    git: *wireless_power_components_repo
    path: components/bsp/shell
    version: *wireless_power_components_version
  circular_flash_buffer:
    git: *wireless_power_components_repo
    path: components/bsp/circular_flash_buffer
    version: *wireless_power_components_version
  Interp:
    git: *wireless_power_components_repo
    path: components/common/Interp
    version: *wireless_power_components_version
  blackbox:
    git: *wireless_power_components_repo
    path: components/middleware/blackbox
    version: *wireless_power_components_version
  battery_level:
    git: *wireless_power_components_repo
    path: components/middleware/battery_level
    version: *wireless_power_components_version
  blackbox_service:
    git: *wireless_power_components_repo
    path: components/middleware/blackbox_service
    version: *wireless_power_components_version
  espnow_link:
    git: *wireless_power_components_repo
    path: components/middleware/espnow_link
    version: *wireless_power_components_version
  espnow_service_proto:
    git: *wireless_power_components_repo
    path: components/product/espnow_service_proto
    version: *wireless_power_components_version
  espnow_service_remote:
    git: *wireless_power_components_repo
    path: components/product/espnow_service_remote
    version: *wireless_power_components_version
  Button:
    git: *wireless_power_components_repo
    path: components/middleware/Button
    version: *wireless_power_components_version
